name: 内核构建‑A15‑6.6.118 原厂版本号
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "KernelSU变体(ksu_mode=禁用KSU，此项会被忽略)"
        required: true
        type: choice
        options:
          - Official
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU
        default: BakaSU

      ksu_mode:
        description: "KernelSU模式｜选【禁用KSU】，不编译任何KSU代码"
        required: true
        type: choice
        options:
          - 关闭
          - 禁用SUSFS
          - 禁用KSU
        default: 禁用KSU

      use_kpm:
        description: "KPM功能｜关闭"
        required: true
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补，尚不支持)"

      droidspaces:
        description: "Droidspaces槽位｜这里只能678，本仓库没有stock原槽补丁"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "678"

      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"

      version:
        description: "【重点】原样粘贴原厂内核版本串，不要修改"
        required: false
        type: string
        default: "6.6.118-android15-8-gb9cc6ec16bc-abogki536571621-4k"

      build_time:
        description: "自定义构建时间(N=当前UTC)"
        required: false
        type: string
        default: "N"

      use_zram:
        description: "启用ZRAM增强算法"
        required: true
        type: boolean
        default: false

      use_bbg:
        description: "启用BBG防格机"
        required: true
        type: boolean
        default: false

      use_rekernel:
        description: "启用Re‑Kernel驱动"
        required: false
        type: boolean
        default: false

      use_nomount:
        description: "启用NoMount挂载元模块"
        required: false
        type: boolean
        default: false

      use_networking:
        description: "网络增强(BBRv3/IPSet，Droidspaces需要打开)"
        required: false
        type: boolean
        default: true

      cve_2026_43499_patch:
        description: "CVE‑2026‑43499 rtmutex修复链"
        required: false
        type: boolean
        default: false

      supp_op:
        description: "一加8E支持"
        required: false
        type: boolean
        default: false

      droidspaces_ntsync:
        description: "Droidspaces NTSync容器时间同步"
        required: false
        type: boolean
        default: true

  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "N"
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false
      use_networking:
        required: false
        type: boolean
        default: true
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      ksu_mode:
        required: false
        type: string
        default: 禁用KSU
      supp_op:
        required: false
        type: boolean
      droidspaces:
        required: false
        type: string
        default: "678"
      artifact_upload_mode:
        required: false
        type: string
        default: "仅上传 AnyKernel3.zip"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: true
      called_from_main:
        description: "内部调用标记"
        required: false
        type: boolean
        default: false
      export_susfs_patches:
        description: "导出SUSFS补丁"
        required: false
        type: boolean
        default: false

jobs:
  build-kernels-a15-6-6:
    name: "6.6.118 原厂版本号｜禁用KSU｜678槽 Droidspaces"
    strategy:
      fail-fast: false
      matrix:
        include:
          - sub_level: "118"
            os_patch_level: "2026-01"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android15"
      kernel_version: "6.6"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      use_networking: ${{ inputs.use_networking || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches || false }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ inputs.ksu_mode != '禁用SUSFS' && inputs.ksu_mode != '禁用KSU' }}
      ksu_mode: ${{ inputs.ksu_mode || '禁用KSU' }}
      droidspaces: ${{ inputs.droidspaces || '678' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}

  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
