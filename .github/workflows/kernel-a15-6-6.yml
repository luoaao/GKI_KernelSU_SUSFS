name: 内核构建 - Android15 6.6.118 Only(Droidspaces完整版)
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 下拉选项 ====================
      kernelsu_variant:
        description: "KernelSU 变体【Droidspaces推荐 BakaSU】"
        required: true
        type: choice
        options:
          - Official
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU
        default: BakaSU

      ksu_mode:
        description: "KernelSU / SUSFS 模式｜关闭=开启SUSFS；禁用SUSFS=关闭SUSFS；禁用KSU=不带Root"
        required: true
        type: choice
        options:
          - 关闭
          - 禁用SUSFS
          - 禁用KSU
        default: 关闭

      use_kpm:
        description: "KPM模块｜Droidspaces不要开启"
        required: true
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补，尚不支持)"

      droidspaces:
        description: "Droidspaces GKI槽位补丁【核心！678优先，卡logo换123，再不行345】off=关闭容器支持"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "678"

      artifact_upload_mode:
        description: "构建产物上传模式｜刷入选仅上传AnyKernel3.zip"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"

      # ==================== 文本输入 ====================
      version:
        description: "自定义版本名 (可选，例如 Mi15P‑DS‑6.6.118)"
        required: false
        type: string
        default: "Mi15P‑DS‑6.6.118"

      build_time:
        description: "自定义构建时间 (N或留空=当前UTC)"
        required: false
        type: string
        default: "N"

      # ==================== 开关选项 ====================
      use_zram:
        description: "ZRAM增强算法｜不需要关闭"
        required: true
        type: boolean
        default: false

      use_bbg:
        description: "BBG防格机｜小米设备关闭"
        required: true
        type: boolean
        default: false

      use_rekernel:
        description: "Re‑Kernel驱动｜Droidspaces不需要"
        required: false
        type: boolean
        default: false

      use_nomount:
        description: "NoMount挂载元模块｜关闭"
        required: false
        type: boolean
        default: false

      use_networking:
        description: "网络增强【Droidspaces NAT网络必须打开，ipset/nftables】"
        required: false
        type: boolean
        default: true

      cve_2026_43499_patch:
        description: "CVE rtmutex修复链｜可选关闭"
        required: false
        type: boolean
        default: false

      supp_op:
        description: "一加8E兼容补丁｜小米设备关闭"
        required: false
        type: boolean
        default: false

      droidspaces_ntsync:
        description: "Droidspaces NTSync容器时间同步【必须打开】"
        required: false
        type: boolean
        default: true

  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "N"
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false
      use_networking:
        required: false
        type: boolean
        default: true
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      ksu_mode:
        required: false
        type: string
        default: 关闭
      supp_op:
        required: false
        type: boolean
      droidspaces:
        required: false
        type: string
        default: "678"
      artifact_upload_mode:
        required: false
        type: string
        default: "仅上传 AnyKernel3.zip"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: true
      called_from_main:
        description: "内部调用标记"
        required: false
        type: boolean
        default: false
      export_susfs_patches:
        description: "导出SUSFS补丁"
        required: false
        type: boolean
        default: false

jobs:
  build-kernels-a15-6-6:
    name: "6.6.118-android15‑2026‑01‑Droidspaces"
    strategy:
      fail-fast: false
      matrix:
        include:
          # 只保留 6.6.118，不再编译其他版本
          - sub_level: "118"
            os_patch_level: "2026-01"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android15"
      kernel_version: "6.6"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      use_networking: ${{ inputs.use_networking || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches || false }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ inputs.ksu_mode != '禁用SUSFS' && inputs.ksu_mode != '禁用KSU' }}
      ksu_mode: ${{ inputs.ksu_mode || '关闭' }}
      droidspaces: ${{ inputs.droidspaces || '678' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}

  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
